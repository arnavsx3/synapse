name: Synapse CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: synapse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::161012475209:role/synapse-github-actions-ecr
  ECR_REPOSITORY: synapse
  EKS_CLUSTER_NAME: synapse-dev
  KUBE_NAMESPACE: synapse-dev
  HELM_RELEASE: synapse

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Lint Helm chart
        run: helm lint deploy/helm/synapse -f deploy/helm/synapse/values-dev.yaml

      - name: Build application
        run: npm run build

  publish-image:
    name: Publish image to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy development to EKS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Configure Kubernetes access
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Verify namespace-scoped deploy access
        run: kubectl auth can-i get deployments --namespace "$KUBE_NAMESPACE"

      - name: Deploy immutable image with Helm
        run: |
          helm upgrade --install "$HELM_RELEASE" deploy/helm/synapse \
            --namespace "$KUBE_NAMESPACE" \
            --values deploy/helm/synapse/values-dev.yaml \
            --set-string image.tag="$GITHUB_SHA" \
            --set-string secrets.existingSecret=synapse-secrets \
            --wait \
            --timeout 10m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/synapse-synapse-app --namespace "$KUBE_NAMESPACE" --timeout=5m
          kubectl rollout status deployment/synapse-synapse-worker --namespace "$KUBE_NAMESPACE" --timeout=5m
          kubectl rollout status deployment/synapse-synapse-nginx --namespace "$KUBE_NAMESPACE" --timeout=5m
          kubectl get ingress --namespace "$KUBE_NAMESPACE"
