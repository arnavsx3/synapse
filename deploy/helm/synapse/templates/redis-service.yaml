apiVersion: v1
kind: Service
metadata:
  name: {{ include "synapse.fullname" . }}-redis
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  selector:
    {{- include "synapse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP

