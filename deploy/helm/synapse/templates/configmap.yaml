apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synapse.fullname" . }}-env
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  REDIS_URL: {{ default (printf "redis://%s-redis:6379" (include "synapse.fullname" .)) .Values.env.REDIS_URL | quote }}
  {{- range $key, $value := .Values.env }}
  {{- if ne $key "REDIS_URL" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synapse.fullname" . }}-nginx
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      client_max_body_size 12m;

      location / {
        proxy_pass http://{{ include "synapse.fullname" . }}-app:{{ .Values.service.app.port }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
      }
    }

