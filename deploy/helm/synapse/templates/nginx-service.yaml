apiVersion: v1
kind: Service
metadata:
  name: {{ include "synapse.fullname" . }}-nginx
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: ClusterIP
  selector:
    {{- include "synapse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  ports:
    - name: http
      port: {{ .Values.service.nginx.port }}
      targetPort: http
      protocol: TCP

