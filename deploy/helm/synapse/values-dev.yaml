global:
  environment: dev

image:
  repository: 161012475209.dkr.ecr.us-east-1.amazonaws.com/synapse
  tag: latest

app:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

worker:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

nginx:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

ingress:
  hosts:
    - host: synapes-dev.online
      paths:
        - path: /
          pathType: Prefix
