services:
  nginx:
    image: nginx:1.27-alpine
    container_name: synapse-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started

  app:
    build:
      context: .
    image: synapse:local
    container_name: synapse-app
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LLM_API_URL: ${LLM_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openrouter/free}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://openrouter.ai/api/v1/embeddings}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-2048}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1200}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_RETRIEVAL_LIMIT: ${RAG_RETRIEVAL_LIMIT:-8}
      RAG_MAX_CHUNKS_PER_CONTEXT: ${RAG_MAX_CHUNKS_PER_CONTEXT:-2}
      RAG_MINIMUM_SIMILARITY: ${RAG_MINIMUM_SIMILARITY:-0.2}
      RAG_MAX_QUERY_LENGTH: ${RAG_MAX_QUERY_LENGTH:-2000}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
    image: synapse:local
    container_name: synapse-worker
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      EMBEDDING_WORKER_CONCURRENCY: ${EMBEDDING_WORKER_CONCURRENCY:-2}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://openrouter.ai/api/v1/embeddings}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-2048}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1200}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_RETRIEVAL_LIMIT: ${RAG_RETRIEVAL_LIMIT:-8}
      RAG_MAX_CHUNKS_PER_CONTEXT: ${RAG_MAX_CHUNKS_PER_CONTEXT:-2}
      RAG_MINIMUM_SIMILARITY: ${RAG_MINIMUM_SIMILARITY:-0.2}
      RAG_MAX_QUERY_LENGTH: ${RAG_MAX_QUERY_LENGTH:-2000}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 2m

  redis:
    image: redis:7-alpine
    container_name: synapse-redis
    expose:
      - "6379"
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1000 --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
